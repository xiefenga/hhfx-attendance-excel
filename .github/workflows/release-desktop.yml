name: Build desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Windows x64
    runs-on: windows-2025
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24.13.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Python dependencies
        run: |
          uv sync --frozen
          uv pip install --python .venv -r packaging/pyinstaller/requirements.txt

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Use tag as application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Run Python tests
        run: uv run pytest -q

      - name: Run Python type checks
        run: uv run mypy attendance_core attendance_sidecar

      - name: Run frontend type checks
        run: npm run typecheck

      - name: Validate Windows PowerShell scripts
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem packaging/windows -File -Filter "*.ps1") {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $messages = $parseErrors.Message -join [Environment]::NewLine
              throw "PowerShell syntax errors in $($script.FullName):`n$messages"
            }
            Write-Host "PowerShell syntax valid: $($script.FullName)"
          }

      - name: Prepare Windows signing certificate
        if: env.WINDOWS_CERTIFICATE != ''
        timeout-minutes: 5
        shell: pwsh
        run: |
          Write-Host "Decoding the PFX secret..."
          $certificatePath = Join-Path $env:RUNNER_TEMP "attendance-certificate.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))

          Write-Host "Opening the PFX with the supplied password..."
          $securePassword = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Get-PfxCertificate -FilePath $certificatePath -Password $securePassword
          if (-not $certificate.HasPrivateKey) {
            throw "The supplied PFX does not contain a private key."
          }

          Write-Host "Exporting the public certificate..."
          $publicCertificatePath = Join-Path $env:RUNNER_TEMP "attendance-certificate.cer"
          Export-Certificate -Cert $certificate -FilePath $publicCertificatePath | Out-Null

          $isSelfSigned = $certificate.Subject -eq $certificate.Issuer
          "WINDOWS_CERTIFICATE_FILE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WINDOWS_PUBLIC_CERTIFICATE_FILE=$publicCertificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WINDOWS_CERTIFICATE_SELF_SIGNED=$isSelfSigned" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Certificate prepared. Self-signed: $isSelfSigned"

      - name: Build installers
        run: npm run make -- --arch=x64

      - name: Verify Windows code signatures
        if: env.WINDOWS_CERTIFICATE_FILE != ''
        shell: pwsh
        run: |
          $securePassword = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $expectedCertificate = Get-PfxCertificate `
            -FilePath $env:WINDOWS_CERTIFICATE_FILE `
            -Password $securePassword
          $targets = @(
            Get-ChildItem out -Recurse -File -Filter "attendance-ledger.exe"
            Get-ChildItem out -Recurse -File -Filter "attendance-worker.exe"
            Get-ChildItem out -Recurse -File -Filter "*Setup.exe"
          )
          if ($targets.Count -lt 3) {
            throw "未找到全部签名验证目标，实际找到 $($targets.Count) 个。"
          }
          $allowedStatuses = @("Valid")
          if ($env:WINDOWS_CERTIFICATE_SELF_SIGNED -eq "True") {
            $allowedStatuses += @("NotTrusted", "UnknownError")
          }
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target.FullName
            if ($null -eq $signature.SignerCertificate) {
              throw "$($target.FullName) 没有可读取的签名证书。"
            }
            if ($signature.SignerCertificate.Thumbprint -ne $expectedCertificate.Thumbprint) {
              throw "$($target.FullName) 不是由预期证书签名。"
            }
            if ($signature.Status.ToString() -notin $allowedStatuses) {
              throw "$($target.FullName) 的签名状态为 $($signature.Status)：$($signature.StatusMessage)"
            }
            Write-Host "签名和指纹有效：$($target.FullName) [$($signature.Status)]"
          }

      - name: Prepare internal Windows release bundle
        if: env.WINDOWS_CERTIFICATE_FILE != ''
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem out/make -Recurse -File -Filter "*Setup.exe")
          if ($installers.Count -ne 1) {
            throw "预期找到一个 Squirrel Setup.exe，实际找到 $($installers.Count) 个。"
          }
          $bundleArguments = @{
            InstallerPath = $installers[0].FullName
            CertificatePath = $env:WINDOWS_PUBLIC_CERTIFICATE_FILE
            ArchivePath = "out/Attendance-Ledger-Windows-x64.zip"
            ApplicationVersion = (node -p "require('./package.json').version")
          }
          if ($env:WINDOWS_CERTIFICATE_SELF_SIGNED -eq "True") {
            $bundleArguments.AllowUntrustedSelfSigned = $true
          }
          ./packaging/windows/New-InternalReleaseBundle.ps1 @bundleArguments

      - name: Verify internal Windows release ZIP
        if: env.WINDOWS_CERTIFICATE_FILE != ''
        shell: pwsh
        run: |
          $archivePath = "out/Attendance-Ledger-Windows-x64.zip"
          ./packaging/windows/Test-InternalReleaseArchive.ps1 -ArchivePath $archivePath

          $extractionDirectory = Join-Path `
            $env:RUNNER_TEMP `
            "Attendance Ledger ZIP Validation"
          Expand-Archive `
            -LiteralPath $archivePath `
            -DestinationPath $extractionDirectory
          $installerScript = Join-Path `
            $extractionDirectory `
            "Attendance Ledger Files/Install-AttendanceLedger.ps1"
          & powershell.exe `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File $installerScript `
            -ValidatePathsOnly
          if ($LASTEXITCODE -ne 0) {
            throw "Windows PowerShell installation path validation failed with exit code $LASTEXITCODE."
          }

      - name: Publish Windows auto-update artifacts to Gitee
        if: startsWith(github.ref, 'refs/tags/v') && env.WINDOWS_CERTIFICATE_FILE != ''
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GITEE_TOKEN)) {
            throw "GITEE_TOKEN repository secret is required for tagged releases."
          }
          ./packaging/windows/Publish-GiteeUpdate.ps1 `
            -ArtifactsDirectory "out/make/squirrel.windows/x64" `
            -Version (node -p "require('./package.json').version")

      - name: Upload Windows release ZIP
        uses: actions/upload-artifact@v6
        with:
          name: attendance-ledger-windows-x64
          path: out/Attendance-Ledger-Windows-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-artifacts/**/*
