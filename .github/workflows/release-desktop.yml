name: Build desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            arch: arm64
            artifact: attendance-ledger-macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            arch: x64
            artifact: attendance-ledger-macos-x64
          - name: Windows x64
            os: windows-2025
            arch: x64
            artifact: attendance-ledger-windows-x64
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24.13.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Python dependencies
        run: |
          uv sync --frozen
          uv pip install --python .venv -r packaging/pyinstaller/requirements.txt

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Use tag as application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Run Python tests
        run: uv run pytest -q

      - name: Run Python type checks
        run: uv run mypy attendance_core attendance_sidecar

      - name: Run frontend type checks
        run: npm run typecheck

      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        shell: bash
        run: |
          certificate_path="$RUNNER_TEMP/attendance-certificate.p12"
          keychain_path="$RUNNER_TEMP/attendance-signing.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"

      - name: Prepare Windows signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        timeout-minutes: 5
        shell: pwsh
        run: |
          Write-Host "Decoding the PFX secret..."
          $certificatePath = Join-Path $env:RUNNER_TEMP "attendance-certificate.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))

          Write-Host "Opening the PFX with the supplied password..."
          $securePassword = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Get-PfxCertificate -FilePath $certificatePath -Password $securePassword
          if (-not $certificate.HasPrivateKey) {
            throw "The supplied PFX does not contain a private key."
          }

          Write-Host "Exporting the public certificate..."
          $publicCertificatePath = Join-Path $env:RUNNER_TEMP "attendance-certificate.cer"
          Export-Certificate -Cert $certificate -FilePath $publicCertificatePath | Out-Null

          $isSelfSigned = $certificate.Subject -eq $certificate.Issuer
          if ($isSelfSigned) {
            Write-Host "Trusting the self-signed certificate for this ephemeral runner..."
            Import-Certificate `
              -FilePath $publicCertificatePath `
              -CertStoreLocation "Cert:\CurrentUser\Root" | Out-Null
            Import-Certificate `
              -FilePath $publicCertificatePath `
              -CertStoreLocation "Cert:\CurrentUser\TrustedPublisher" | Out-Null
          }

          "WINDOWS_CERTIFICATE_FILE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WINDOWS_PUBLIC_CERTIFICATE_FILE=$publicCertificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WINDOWS_CERTIFICATE_SELF_SIGNED=$isSelfSigned" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Certificate prepared. Self-signed: $isSelfSigned"

      - name: Build installers
        run: npm run make -- --arch=${{ matrix.arch }}

      - name: Verify Windows code signatures
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE_FILE != ''
        shell: pwsh
        run: |
          $securePassword = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $expectedCertificate = Get-PfxCertificate `
            -FilePath $env:WINDOWS_CERTIFICATE_FILE `
            -Password $securePassword
          $targets = @(
            Get-ChildItem out -Recurse -File -Filter "attendance-ledger.exe"
            Get-ChildItem out -Recurse -File -Filter "attendance-worker.exe"
            Get-ChildItem out -Recurse -File -Filter "*Setup.exe"
          )
          if ($targets.Count -lt 3) {
            throw "未找到全部签名验证目标，实际找到 $($targets.Count) 个。"
          }
          $allowedStatuses = @("Valid")
          if ($env:WINDOWS_CERTIFICATE_SELF_SIGNED -eq "True") {
            $allowedStatuses += "NotTrusted"
          }
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target.FullName
            if ($signature.Status.ToString() -notin $allowedStatuses) {
              throw "$($target.FullName) 的签名状态为 $($signature.Status)。"
            }
            if ($null -eq $signature.SignerCertificate) {
              throw "$($target.FullName) 没有可读取的签名证书。"
            }
            if ($signature.SignerCertificate.Thumbprint -ne $expectedCertificate.Thumbprint) {
              throw "$($target.FullName) 不是由预期证书签名。"
            }
            Write-Host "签名和指纹有效：$($target.FullName) [$($signature.Status)]"
          }

      - name: Prepare internal Windows release bundle
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE_FILE != ''
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem out/make -Recurse -File -Filter "*Setup.exe")
          if ($installers.Count -ne 1) {
            throw "预期找到一个 Squirrel Setup.exe，实际找到 $($installers.Count) 个。"
          }
          $bundleArguments = @{
            InstallerPath = $installers[0].FullName
            CertificatePath = $env:WINDOWS_PUBLIC_CERTIFICATE_FILE
            OutputDirectory = "out/attendance-ledger-internal-release"
          }
          if ($env:WINDOWS_CERTIFICATE_SELF_SIGNED -eq "True") {
            $bundleArguments.AllowUntrustedSelfSigned = $true
          }
          ./packaging/windows/New-InternalReleaseBundle.ps1 @bundleArguments

      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            out/make/**/*
            out/attendance-ledger-internal-release/**/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v6
        with:
          path: release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/**/*
